[package]
name = "red-core"
version = "0.1.0"
edition = "2021"
description = "Red — shared domain models, typed IPC, and application errors"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
